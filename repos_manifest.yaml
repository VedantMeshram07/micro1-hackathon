    pinned_commit: "9aab13f48aba0d13febe7bfd04f56fcae21649c1"
    notes: "medical device data receiving tool, automated parsing application"
  - id: repo_3
    github_url: "https://github.com/RudraaChudasama/process-scheduler.git"
    pinned_commit: "fb7c59b274f0d6e7d573d9789cea7d0c9e30b3ab"
    notes: "operating system process scheduling simulator, implementation of classic CPU algorithms"
  - id: repo_4
